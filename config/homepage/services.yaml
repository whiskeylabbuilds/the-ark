# Plain-language names first; the app name is in the description.
# This is the public default. To customize without touching it, copy it to local/homepage/services.yaml
# and mount that in local/compose.yml (see local.example/).
# Links use HOMEPAGE_VAR_HOST (HOST_ADDR in .env). All icons are local (/icons = config/homepage/icons).

- Ask the Ark:
    - Ask the Ark (AI):
        id: ark-ai
        href: http://{{HOMEPAGE_VAR_HOST}}:3000
        icon: /icons/open-webui.svg
        description: Ask anything, from repairs and first aid to cooking, history and homework. Private and offline, it runs entirely on the Ark. Pick Ark Mechanic for vehicle and equipment repairs. Double-check medical answers in the Library.
        siteMonitor: http://open-webui:8080

- Start Here:
    - Getting Started & FAQ:
        id: ark-getting-started
        href: /pages/getting-started.html
        icon: /icons/mdi-help-circle.svg
        description: What each section does, adding books and courses, common questions
    - Voice Setup (one time per device):
        id: ark-voice
        href: /pages/getting-started.html#voice
        icon: /icons/mdi-microphone.svg
        description: Talk to Ask the Ark and hear it answer. Install the Ark certificate once, then use https://{{HOMEPAGE_VAR_HOST}}:3443
    - About The Ark:
        id: ark-about
        href: /pages/about.html
        icon: /icons/ark.svg
        description: What the Ark is, what it's built with, and who made it · WhiskeyLab

- Library & Learning:
