        description: Khan Academy math, science and more · Kolibri
        siteMonitor: http://kolibri:8300
    - Bookshelf:
        id: ark-books
        href: http://{{HOMEPAGE_VAR_HOST}}:5000
        icon: /icons/kavita.svg
        description: Bible, philosophy, field manuals, PDFs · Kavita
        siteMonitor: http://kavita:5000
    - Music:
        id: ark-music
        href: http://{{HOMEPAGE_VAR_HOST}}:4533
        icon: /icons/mdi-music.svg
        description: Your music library, in any browser or phone app · Navidrome
        siteMonitor: http://navidrome:4533

- Notes & Tools:
    - Field Notes:
        id: ark-notes
        href: http://{{HOMEPAGE_VAR_HOST}}:8083
        icon: /icons/flatnotes.svg
        description: Shared notes, checklists, logs · FlatNotes
        siteMonitor: http://flatnotes:8080
    - Data Toolkit:
        id: ark-cyberchef
        href: http://{{HOMEPAGE_VAR_HOST}}:8084
