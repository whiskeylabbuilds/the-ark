- Maps & Radio:
    - Regional Map:
        id: ark-maps
        href: http://{{HOMEPAGE_VAR_HOST}}:8082
        icon: /icons/mdi-map.svg
        description: {{HOMEPAGE_VAR_MAP_REGION}} · offline
        siteMonitor: http://maps:80
    - Mesh Radio (Meshtastic):
        id: ark-mesh
        href: http://localhost:8085
        icon: /icons/meshtastic.svg
        description: Meshtastic client. Open on the Ark itself, in Chromium
        siteMonitor: http://meshtastic-web:8080
    - Mesh Radio (MeshCore):
        id: ark-meshcore
        href: http://{{HOMEPAGE_VAR_HOST}}:8086
        icon: /icons/mdi-radio-tower.svg
        description: MeshCore messaging through the radio plugged into the Ark, from any device · mc-webui
        siteMonitor: http://meshcore-web:5000

- System Status:
    - Graphics Card:
        id: ark-gpu
        icon: /icons/mdi-gauge.svg
        description: Runs the AI · live, every 10 s
        widget:
          type: customapi
          url: http://stats:9100/
          refreshInterval: 10000
          mappings:
            - field: gpu
              label: Card
            - field: gpu_util
              label: Usage
            - field: gpu_mem
              label: Memory
            - field: gpu_temp
              label: Temp
    - Power:
        id: ark-power
        icon: /icons/mdi-gauge.svg
        description: Measured by the CPU and graphics card · wall draw is a little higher
        widget:
          type: customapi
          url: http://stats:9100/
          refreshInterval: 10000
          mappings:
            - field: cpu_power
              label: CPU
            - field: gpu_power
              label: GPU
            - field: total_power
              label: Total
